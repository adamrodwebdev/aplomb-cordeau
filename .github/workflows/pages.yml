# Publishes the site on GitHub Pages. The typeface and the models are not in this repository: the
# copy step fetches them from the private repo at the commit pinned in assets.lock.json, checks
# each one, and stops the deploy when any is missing or different.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it uses
permissions:
  contents: read

# One deploy at a time, and a deploy in progress is never cut short
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A manual run started from another branch does nothing: only main is published
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The only step that sees the token; the script sends it in a header and never prints it
      - name: Copy in the private assets
        run: node tools/fetch-assets.mjs
        env:
          PRIVATE_ASSETS_TOKEN: ${{ secrets.PRIVATE_ASSETS_TOKEN }}

      - name: Check the files in place
        run: node tools/fetch-assets.mjs --check

      # Hidden files, .git and .github stay out of the artifact
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
